<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的 - 校园掏</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header" class="header"></div>

<div class="container">
    <div class="card">
        <div class="page-title" id="userInfo">我的</div>
    </div>

    <div class="tabs">
        <div class="tab" data-tab="goods" onclick="switchTab('goods')">我发布的</div>
        <div class="tab" data-tab="order" onclick="switchTab('order')">我的订单</div>
        <div class="tab" data-tab="sell" onclick="switchTab('sell')">我卖出的</div>
        <div class="tab" data-tab="collect" onclick="switchTab('collect')">我的收藏</div>
    </div>

    <div class="card">
        <div id="content"></div>
        <div id="empty" class="empty" style="display:none">暂无数据</div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    API.renderHeader('my');
    if (!API.requireLogin()) {
        document.body.innerHTML = '';
    }

    const STATUS_TEXT = ['待付款', '已付款', '已发货', '已完成', '已取消'];
    let curTab = API.param('tab', 'goods');
    let page = 1;

    async function loadUser() {
        const res = await API.get('/web/user/info');
        if (res.code === 200 && res.data) {
            const u = res.data;
            document.getElementById('userInfo').textContent =
                `我的（${u.nickName || u.userName}）`;
        }
    }

    function switchTab(tab) {
        curTab = tab;
        page = 1;
        document.querySelectorAll('.tab').forEach(el => {
            el.classList.toggle('active', el.dataset.tab === tab);
        });
        render();
    }

    async function render() {
        const box = document.getElementById('content');
        const empty = document.getElementById('empty');
        box.innerHTML = '<div class="empty">加载中...</div>';
        empty.style.display = 'none';

        if (curTab === 'goods') return renderGoods(box, empty);
        if (curTab === 'order') return renderOrders(box, empty);
        if (curTab === 'sell') return renderSells(box, empty);
        if (curTab === 'collect') return renderCollects(box, empty);
    }

    /** 我发布的商品 */
    async function renderGoods(box, empty) {
        const res = await API.post('/web/goods/my', { pageNum: page, pageSize: 10 });
        if (res.code !== 200) {
            box.innerHTML = '';
            API.toast(res.msg || '查询失败');
            return;
        }
        const rows = (res.data && res.data.rows) || [];
        empty.style.display = rows.length ? 'none' : 'block';
        empty.textContent = '还没有发布商品';
        box.innerHTML = rows.map(g => `
            <div class="list-item">
                <div class="thumb">${API.coverHtml(g.cover, '图')}</div>
                <div class="main">
                    <div>${g.title}</div>
                    <div class="sub">¥ ${API.money(g.price)} · ${g.status === 1 ? '在售' : '已下架'} · ${API.time(g.createTime)}</div>
                </div>
                <div class="list-actions">
                    <button class="btn btn-outline btn-sm" onclick="toggleStatus(${g.id}, ${g.status})">
                        ${g.status === 1 ? '下架' : '上架'}
                    </button>
                    <button class="btn btn-sm" onclick="delGoods(${g.id})">删除</button>
                </div>
            </div>`).join('');
    }

    /** 我的订单 */
    async function renderOrders(box, empty) {
        const res = await API.post('/web/order/page', { pageNum: page, pageSize: 10 });
        if (res.code !== 200) {
            box.innerHTML = '';
            API.toast(res.msg || '查询失败');
            return;
        }
        const rows = (res.data && res.data.rows) || [];
        empty.style.display = rows.length ? 'none' : 'block';
        empty.textContent = '还没有订单';
        box.innerHTML = rows.map(o => `
            <div class="list-item">
                <div class="main">
                    <div>${o.goodsName} × ${o.quantity}</div>
                    <div class="sub">订单号 ${o.orderNo} · 实付 ¥ ${API.money(o.totalAmount)} · ${STATUS_TEXT[o.status] || ''} · ${API.time(o.createTime)}</div>
                    <div class="sub">收货：${o.receiver || ''} ${o.phone || ''} ${o.address || ''}</div>
                </div>
                <div class="list-actions">
                    ${o.status === 0 ? `<button class="btn btn-sm" onclick="payOrder(${o.id})">付款</button><button class="btn btn-outline btn-sm" onclick="cancelOrder(${o.id})">取消</button>` : ''}
                    ${o.status === 1 ? `<span class="sub">等待卖家发货</span>` : ''}
                    ${o.status === 2 ? `<button class="btn btn-sm" onclick="confirmOrder(${o.id})">确认收货</button>` : ''}
                </div>
            </div>`).join('');
    }

    /** 我的收藏 */
    async function renderCollects(box, empty) {
        const res = await API.get('/web/collect/my');
        if (res.code !== 200) {
            box.innerHTML = '';
            API.toast(res.msg || '查询失败');
            return;
        }
        const ids = res.data || [];
        empty.style.display = ids.length ? 'none' : 'block';
        empty.textContent = '还没有收藏商品';
        if (!ids.length) {
            box.innerHTML = '';
            return;
        }
        const items = [];
        for (const gid of ids) {
            const r = await API.get('/web/goods/getInfo/' + gid);
            if (r.code === 200 && r.data) items.push(r.data);
        }
        box.innerHTML = items.map(g => `
            <div class="list-item">
                <div class="thumb">${API.coverHtml(g.cover, '图')}</div>
                <div class="main">
                    <div>${g.title}</div>
                    <div class="sub">¥ ${API.money(g.price)} · ${g.status === 1 ? '在售' : '已下架'}</div>
                </div>
                <div class="list-actions">
                    <button class="btn btn-outline btn-sm" onclick="location.href='detail.html?id=${g.id}'">查看</button>
                </div>
            </div>`).join('');
    }

    async function toggleStatus(id, status) {
        const res = await API.put('/web/goods/status/' + id, { status: status === 1 ? 0 : 1 });
        API.toast(res.code === 200 ? '操作成功' : (res.msg || '操作失败'));
        render();
    }

    async function delGoods(id) {
        if (!confirm('确定删除这件商品吗？')) return;
        const res = await API.del('/web/goods/dele/' + id);
        API.toast(res.code === 200 ? '删除成功' : (res.msg || '删除失败'));
        render();
    }

    async function cancelOrder(id) {
        if (!confirm('确定取消该订单吗？')) return;
        const res = await API.post('/web/order/cancel/' + id);
        API.toast(res.code === 200 ? '已取消订单' : (res.msg || '操作失败'));
        render();
    }

    async function payOrder(id) {
        if (!confirm('确认付款该订单？')) return;
        const res = await API.post('/web/order/pay/' + id);
        API.toast(res.code === 200 ? '付款成功' : (res.msg || '操作失败'));
        render();
    }

    async function confirmOrder(id) {
        if (!confirm('确认已收到商品？')) return;
        const res = await API.post('/web/order/confirm/' + id);
        API.toast(res.code === 200 ? '已确认收货' : (res.msg || '操作失败'));
        render();
    }

    /** 我卖出的订单（卖家视角） */
    async function renderSells(box, empty) {
        const res = await API.post('/web/order/sellPage', { pageNum: page, pageSize: 10 });
        if (res.code !== 200) {
            box.innerHTML = '';
            API.toast(res.msg || '查询失败');
            return;
        }
        const rows = (res.data && res.data.rows) || [];
        empty.style.display = rows.length ? 'none' : 'block';
        empty.textContent = '还没有卖出订单';
        box.innerHTML = rows.map(o => `
            <div class="list-item">
                <div class="main">
                    <div>${o.goodsName} × ${o.quantity}</div>
                    <div class="sub">订单号 ${o.orderNo} · 实付 ¥ ${API.money(o.totalAmount)} · ${STATUS_TEXT[o.status] || ''} · ${API.time(o.createTime)}</div>
                    <div class="sub">收货：${o.receiver || ''} ${o.phone || ''} ${o.address || ''}</div>
                </div>
                <div class="list-actions">
                    ${o.status === 0 ? `<span class="sub">等待买家付款</span>` : ''}
                    ${o.status === 1 ? `<button class="btn btn-sm" onclick="shipOrder(${o.id})">发货</button>` : ''}
                    ${o.status === 2 ? `<button class="btn btn-sm" onclick="completeOrder(${o.id})">完成订单</button>` : ''}
                    ${o.status === 3 ? `<span class="sub">交易完成</span>` : ''}
                    ${o.status === 4 ? `<span class="sub">已取消</span>` : ''}
                </div>
            </div>`).join('');
    }

    async function shipOrder(id) {
        if (!confirm('确认发货？')) return;
        const res = await API.post('/web/order/ship/' + id);
        API.toast(res.code === 200 ? '已发货' : (res.msg || '操作失败'));
        render();
    }

    async function completeOrder(id) {
        if (!confirm('确认标记订单完成？')) return;
        const res = await API.post('/web/order/complete/' + id);
        API.toast(res.code === 200 ? '已完成' : (res.msg || '操作失败'));
        render();
    }

    loadUser();
    switchTab(curTab);
</script>
</body>
</html>
