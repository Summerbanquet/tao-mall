<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>注册 - 校园掏</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header" class="header"></div>

<div class="container">
    <div class="card login-form">
        <div class="page-title">用户注册</div>
        <div class="form-item">
            <label>用户名 <span style="color:#e74c3c">*</span></label>
            <input id="userName" placeholder="请输入用户名" onblur="checkName()">
            <div class="form-tip" id="nameTip"></div>
        </div>
        <div class="form-item">
            <label>密码 <span style="color:#e74c3c">*</span></label>
            <input id="password" type="password" placeholder="请输入密码">
        </div>
        <div class="form-item">
            <label>确认密码 <span style="color:#e74c3c">*</span></label>
            <input id="password2" type="password" placeholder="请再次输入密码">
        </div>
        <div class="form-item">
            <label>姓名 <span style="color:#e74c3c">*</span></label>
            <input id="name" placeholder="请输入真实姓名">
        </div>
        <div class="form-item">
            <label>手机号 <span style="color:#e74c3c">*</span></label>
            <input id="phone" placeholder="请输入 11 位手机号">
        </div>
        <div class="form-item">
            <label>邮箱 <span style="color:#e74c3c">*</span></label>
            <input id="email" placeholder="请输入邮箱" onblur="checkEmail()">
            <div class="form-tip" id="emailTip"></div>
        </div>
        <div class="form-item">
            <label>昵称</label>
            <input id="nickName" placeholder="选填，不填自动生成随机昵称">
        </div>
        <div class="form-item">
            <label>验证码 <span style="color:#e74c3c">*</span></label>
            <input id="validateCode" placeholder="演示阶段任意填写">
            <div class="form-tip">当前为演示环境，验证码不做真实校验</div>
        </div>
        <button class="btn btn-block" onclick="register()">注 册</button>
        <div class="form-tip" style="margin-top:14px;text-align:center">
            已有账号？<a href="login.html" style="color:#ff6b35">去登录</a>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    API.renderHeader('');

    async function checkName() {
        const userName = document.getElementById('userName').value.trim();
        const tip = document.getElementById('nameTip');
        if (!userName) {
            tip.textContent = '';
            return;
        }
        const res = await API.get('/web/user/checkUserName/' + encodeURIComponent(userName));
        if (res.code === 200) {
            tip.className = 'form-tip ok';
            tip.textContent = '该用户名可以使用';
        } else {
            tip.className = 'form-tip error';
            tip.textContent = res.msg || '该用户名已被占用';
        }
    }

    /** 校验邮箱（应用层仅做基本格式校验，唯一性由后端在提交时校验） */
    async function checkEmail() {
        const email = document.getElementById('email').value.trim();
        const tip = document.getElementById('emailTip');
        if (!email) {
            tip.textContent = '';
            return;
        }
        if (!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email)) {
            tip.className = 'form-tip error';
            tip.textContent = '邮箱格式不正确';
        } else {
            tip.className = 'form-tip ok';
            tip.textContent = '邮箱格式正确';
        }
    }

    async function register() {
        const userName = document.getElementById('userName').value.trim();
        const password = document.getElementById('password').value;
        const password2 = document.getElementById('password2').value;
        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const nickName = document.getElementById('nickName').value.trim();
        const validateCode = document.getElementById('validateCode').value.trim();

        if (!userName || !password || !name || !phone || !email || !validateCode) {
            API.toast('带 * 号的字段均为必填项');
            return;
        }
        if (password !== password2) {
            API.toast('两次输入的密码不一致');
            return;
        }
        if (!/^1[3-9]\d{9}$/.test(phone)) {
            API.toast('手机号格式不正确');
            return;
        }
        const res = await API.post('/web/user/register', {
            userName, password, name, phone, email, nickName, validateCode
        });
        if (res.code !== 200) {
            API.toast(res.msg || '注册失败');
            return;
        }
        API.toast('注册成功，请登录');
        setTimeout(() => location.href = 'login.html', 800);
    }
</script>
</body>
</html>
