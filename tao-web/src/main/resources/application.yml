server:
  port: 8080

spring:
  application:
    name: tao_svr
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/campus_tao?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowMultiQueries=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 12 # \u6700\u5927\u8FDE\u63A5\u6570
      idle-timeout: 30000
      minimum-idle: 5 # \u6700\u5C0F\u7A7A\u95F2\u8FDE\u63A5

# MyBatis-Plus
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

file:
  upload:
    path: D:/tao/uploads
