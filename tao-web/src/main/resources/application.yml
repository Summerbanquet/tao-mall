server:
  port: 8080

spring:
  application:
    name: tao_svr
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/campus_tao?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowMultiQueries=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 12 # 最大连接数
      idle-timeout: 30000
      minimum-idle: 5 # 最小空闲连接
  servlet:
    multipart:          # 不配的话单文件默认最大1MB
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis-Plus
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

file:
  upload:
    path: D:/tao/uploads
